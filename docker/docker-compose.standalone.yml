version: '3.8'

services:
  traefik:
    image: traefik:v3.2
    container_name: standalone_traefik
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_certs:/letsencrypt"

  postgres:
    image: postgres:16-alpine
    container_name: standalone_postgres
    restart: always
    environment:
      POSTGRES_DB: telegram_commerce_standalone
      POSTGRES_USER: standalone_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-standalone_secure_password_123}
    volumes:
      - standalone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standalone_user -d telegram_commerce_standalone"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: standalone_api
    restart: always
    environment:
      MODE: standalone
      PORT: 3000
      HOST: 0.0.0.0
      STANDALONE_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      DATABASE_URL: postgresql://standalone_user:${DB_PASSWORD:-standalone_secure_password_123}@postgres:5432/telegram_commerce_standalone?schema=public
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JWT_SECRET: ${JWT_SECRET:-standalone_jwt_secret_987654321}
      PUBLIC_API_URL: https://api.${DOMAIN_NAME}
      PUBLIC_MINIAPP_URL: https://${DOMAIN_NAME}
      PUBLIC_ADMIN_URL: https://admin.${DOMAIN_NAME}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN_NAME}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

  miniapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.miniapp
    container_name: standalone_miniapp
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.miniapp.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.miniapp.entrypoints=websecure"
      - "traefik.http.routers.miniapp.tls.certresolver=letsencrypt"
      - "traefik.http.services.miniapp.loadbalancer.server.port=80"

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: standalone_admin
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.${DOMAIN_NAME}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=80"

volumes:
  standalone_pgdata:
  traefik_certs:
