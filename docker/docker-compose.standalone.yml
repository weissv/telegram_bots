version: '3.8'

services:
  traefik:
    image: traefik:v3.2
    container_name: standalone_traefik
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_certs:/letsencrypt"

  postgres:
    image: postgres:16-alpine
    container_name: standalone_postgres
    restart: always
    environment:
      POSTGRES_DB: telegram_commerce_standalone
      POSTGRES_USER: standalone_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - standalone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standalone_user -d telegram_commerce_standalone"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: standalone_redis
    restart: always
    volumes:
      - standalone_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: standalone_api
    restart: always
    environment:
      NODE_ENV: production
      MODE: standalone
      PORT: 3000
      HOST: 0.0.0.0
      STANDALONE_TENANT_ID: ${STANDALONE_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      STANDALONE_BOT_TOKEN: ${STANDALONE_BOT_TOKEN:?STANDALONE_BOT_TOKEN is required}
      STANDALONE_ADMIN_TELEGRAM_ID: ${STANDALONE_ADMIN_TELEGRAM_ID:?STANDALONE_ADMIN_TELEGRAM_ID is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      DATABASE_URL: postgresql://standalone_user:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/telegram_commerce_standalone?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.${DOMAIN_NAME:?DOMAIN_NAME is required}}
      PUBLIC_MINIAPP_URL: ${PUBLIC_MINIAPP_URL:-https://${DOMAIN_NAME:?DOMAIN_NAME is required}}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-https://admin.${DOMAIN_NAME:?DOMAIN_NAME is required}}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN_NAME}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

  miniapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.miniapp
    container_name: standalone_miniapp
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.miniapp.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.miniapp.entrypoints=websecure"
      - "traefik.http.routers.miniapp.tls.certresolver=letsencrypt"
      - "traefik.http.services.miniapp.loadbalancer.server.port=80"

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: standalone_admin
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.${DOMAIN_NAME}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=80"

volumes:
  standalone_pgdata:
  standalone_redisdata:
  traefik_certs:
