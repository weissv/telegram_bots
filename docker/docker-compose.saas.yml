version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tg_commerce_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_commerce}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-telegram_commerce}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tg_commerce_redis
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: tg_commerce_api
    restart: always
    environment:
      NODE_ENV: production
      MODE: saas
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-telegram_commerce}?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MASTER_BOT_TOKEN: ${MASTER_BOT_TOKEN:-}
      MASTER_BOT_USERNAME: ${MASTER_BOT_USERNAME:-miraiedu_bot}
      SUPERADMIN_TELEGRAM_ID: ${SUPERADMIN_TELEGRAM_ID:-}
      ALLOW_DEMO_LOGIN: ${ALLOW_DEMO_LOGIN:-false}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      PUBLIC_MINIAPP_URL: ${PUBLIC_MINIAPP_URL:-}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-}
      PUBLIC_LANDING_URL: ${PUBLIC_LANDING_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  master-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.masterbot
    container_name: tg_commerce_masterbot
    restart: always
    environment:
      NODE_ENV: production
      MODE: saas
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-telegram_commerce}?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MASTER_BOT_TOKEN: ${MASTER_BOT_TOKEN:?MASTER_BOT_TOKEN is required}
      MASTER_BOT_USERNAME: ${MASTER_BOT_USERNAME:-miraiedu_bot}
      SUPERADMIN_TELEGRAM_ID: ${SUPERADMIN_TELEGRAM_ID:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      PUBLIC_MINIAPP_URL: ${PUBLIC_MINIAPP_URL:-}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  miniapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.miniapp
    container_name: tg_commerce_miniapp
    restart: always
    ports:
      - "5173:80"

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: tg_commerce_admin
    restart: always
    ports:
      - "5174:80"

  landing:
    build:
      context: ..
      dockerfile: docker/Dockerfile.landing
    container_name: tg_commerce_landing
    restart: always
    ports:
      - "5175:80"

volumes:
  pgdata:
  redisdata:
